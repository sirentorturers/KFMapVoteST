; ====================================================================
;  KFMapVoteModes.ini
;  SirenTorturers Edition (KFMapVoteST)
;
;  One [SectionName KFGameConfigEntry] section per game mode. Each
;  section is parsed independently - there is no shared array and no
;  shared 4095-character limit across modes, so add as many as you like.
;
;  The section's leading token (e.g. 00_Standard_Hard) is a permanent
;  instance ID - rename it and you create a NEW entry rather than
;  rename the existing one. GameName is the actual display text shown
;  in the vote screen and is safe to edit freely. Leading index numbers
;  have been removed from GameName - SortOrder now controls vote-list
;  position instead.
;
;  Difficulty is parsed from GameName. Sui and HoE are valid acronyms,
;  and the full difficulty names can also be used.
;
;  This file reintroduces Hard/Suicidal difficulty tiers that were
;  previously only available via the rotations notes file, now that
;  the 4095-char limit no longer constrains how many entries can exist.
;
;  Description= is optional flavor text shown in the map vote GUI's
;  description panel when that mode is selected. Leave it off (or blank)
;  and the panel just stays empty for that mode.
;
;  SortOrder= is how the game modes will be shown in game. It starts with
;  numbers 1 onwards. Anything 0 will be sorted after the last real number
;  alphabetically.
;
;  MapListStyle= restricts which maps this mode offers, on top of the
;  Prefix match above. Leave it off for the default, "All" (every
;  Prefix-matching map, same as before this option existed). "Allow"
;  restricts this mode to only the maps listed in AllowMap=; "Exclude"
;  offers every Prefix-matching map except the ones listed in
;  ExcludeMap=. Repeat AllowMap=/ExcludeMap= once per map. Example:
;
;      MapListStyle=Allow
;      AllowMap=KF-BioticsLab
;      AllowMap=KF-WestLondon
;
;      MapListStyle=Exclude
;      ExcludeMap=KF-Waterworks
;
;  MapListStyle=Copy mirrors another mode's map list instead of
;  duplicating it - handy for keeping every difficulty tier of the same
;  mode (e.g. 00_Standard_Hard/01_Standard_Sui/02_Standard_HoE) in sync.
;  Set CopyMapList= to the target mode's section ID (the same permanent
;  instance ID this comment block mentions above, NOT its GameName).
;  Example - 01_Standard_Sui copies whatever 00_Standard_Hard has set:
;
;      MapListStyle=Copy
;      CopyMapList=00_Standard_Hard
;
;  bDisabled= hides a mode from the vote GUI entirely without deleting its
;  section. Leave it off for the default, false. Example:
;
;      bDisabled=true
; ====================================================================


[00_Standard_Hard KFGameConfigEntry]
GameClass=SirenTorturers.G
Prefix=KF-
Acronym=KF
GameName=Standard: Hard
Options=GameLength=178
SortOrder=1
Description=Stock ScrnBalance rules on Hard difficulty.

