; Playback speed (frames/sec) for animated preview images in the map
; vote footer's preview panel (see KFMapVoteFooterX.ApplyPreviewAnimRate).
; Lower = slower/smoother, higher = faster. Defaults to 1.0 if omitted.
PreviewAnimFrameRate=1.0

; Optional admin-configurable "Custom" difficulty slots (up to 3). Leave
; blank (default) to disable a slot. Each slot's value is BOTH the
; recognized trailing suffix word/phrase in a mode's GameName AND the
; exact text shown/selected in the difficulty dropdown - e.g.
; CustomDifficulty1=Zed Rush makes a KFMapVoteModes.ini entry with
; GameName="MyMode Zed Rush" resolve to difficulty "Zed Rush". Checked
; after the 8 built-in difficulty words, so a custom label can never
; shadow a reserved one.
CustomDifficulty1=
CustomDifficulty2=
CustomDifficulty3=

; GameConfig entries have moved to KFMapVoteModes.ini - see that file
; for the full list of game modes (one KFGameConfigEntry section per
; mode). This file only holds KFVotingHandler's own top-level settings.
