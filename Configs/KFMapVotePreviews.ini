; ====================================================================
;  KFMapVotePreviews.ini
;  SirenTorturers Edition (KFMapVoteST)
;
;  One [MapName KFMapPreviewEntry] section per map you want a working
;  preview image for in the map vote GUI. The section name MUST be the
;  exact map filename with no extension (e.g. KF-Boardwalk, matching
;  what shows up in the vote map list) - that's how KFMapVoteFooterX
;  looks entries up.
;
;  Why this file exists: the vote GUI's preview panel can only read a
;  map's own embedded screenshot/author/player-count if the connecting
;  client already has that map's full package downloaded locally - true
;  only for maps they've already played. Any map without a section here
;  falls back to that (unreliable, client-dependent) lookup and likely
;  shows "No Preview Available" for players who haven't played it yet.
;
;  TextureRef must point into a texture package that ships alongside
;  this mod (e.g. a shared KFMapVoteST_Previews.utx placed next to
;  KFAnnounc.uax) so every connecting client actually has it - NOT into
;  the map's own package. Author/PlayerCountMin/PlayerCountMax are
;  optional free-text/number overrides shown alongside the image; leave
;  them blank/0 to just show the image with no author/player-count line.
;
;  Example (uncomment and edit once KFMapVoteST_Previews.utx exists):
;
; [KF-Boardwalk KFMapPreviewEntry]
; TextureRef=KFMapVoteST_Previews.KF-Boardwalk_Preview
; Author={ST}WaffleTime | {ST}Broski
; PlayerCountMin=6
; PlayerCountMax=12
; ====================================================================
